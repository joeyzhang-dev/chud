<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    color: #e8e8ee;
    -webkit-user-select: none;
    overflow: hidden;
  }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: rgba(18, 18, 26, 0.94);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    overflow: hidden;
  }
  header {
    -webkit-app-region: drag;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px 8px;
    flex-shrink: 0;
  }
  header .title { font-weight: 600; font-size: 12px; letter-spacing: 0.3px; }
  header .count {
    font-size: 10px; color: #9aa0b0;
    background: rgba(255,255,255,0.07);
    padding: 2px 7px; border-radius: 8px;
  }
  header .spacer { flex: 1; }
  header .close, header .gear, header .refresh {
    -webkit-app-region: no-drag;
    cursor: pointer; color: #666; font-size: 13px;
    width: 20px; height: 20px; line-height: 20px; text-align: center;
    border-radius: 6px;
  }
  header .close:hover { background: rgba(255,80,80,0.2); color: #ff7070; }
  header .gear:hover, header .gear.active,
  header .refresh:hover { background: rgba(255,255,255,0.12); color: #d0d4e0; }
  header .refresh.spin { animation: spin 0.6s linear; color: #60a5fa; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .badge.live { background: rgba(74,222,128,0.18); color: #7dd3a8; }
  #settings {
    flex-shrink: 0;
    padding: 4px 14px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    margin-bottom: 6px;
  }
  #settings.hidden { display: none; }
  #settings label {
    display: flex; align-items: center; gap: 8px;
    color: #9aa0b0; font-size: 11px; margin-top: 7px;
  }
  #settings label span.lbl { flex: 0 0 110px; }
  #settings input[type=range] {
    flex: 1; -webkit-appearance: none; height: 3px;
    background: rgba(255,255,255,0.15); border-radius: 2px; outline: none;
  }
  #settings input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: #8b93ab; cursor: pointer;
  }
  #settings input[type=range]::-webkit-slider-thumb:hover { background: #b7bcc9; }
  #settings .val { flex: 0 0 34px; text-align: right; color: #7c8194; font-variant-numeric: tabular-nums; }
  #settings input[type=checkbox] { accent-color: #60a5fa; }
  #settings input[type=text] {
    flex: 1; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px; color: #d0d4e0; font-size: 11px; padding: 4px 7px; outline: none;
    font-family: inherit;
  }
  #settings input[type=text] { cursor: pointer; text-align: center; }
  #settings input.pathbox { cursor: text; text-align: left; }
  #settings input[type=text]:focus { border-color: rgba(96,165,250,0.7); background: rgba(96,165,250,0.10); cursor: default; }
  #settings .hint { color: #565b6b; font-size: 10px; margin-top: 6px; }
  #settings .hint.error { color: #ff7070; }
  .card.selected { border-color: rgba(96,165,250,0.8); background: rgba(96,165,250,0.10); }
  #app.compact .prompt, #app.compact .reply { display: none; }
  #app.compact .card { padding: 6px 10px; margin-bottom: 4px; }
  #list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  #list::-webkit-scrollbar { width: 4px; }
  #list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }
  .card {
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 6px;
  }
  .card { cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; }
  .card:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.18); }
  .card:active { transform: scale(0.985); }
  .card.clicked { border-color: rgba(96,165,250,0.7); }
  .card.needs-input { border-color: rgba(255,170,60,0.45); background: rgba(255,170,60,0.08); }
  .card.ended { opacity: 0.45; }
  .row { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.working { background: #4ade80; animation: pulse 1.4s ease-in-out infinite; }
  .dot.needs-input { background: #fb923c; animation: pulse 0.8s ease-in-out infinite; }
  .dot.done { background: #60a5fa; }
  .dot.idle, .dot.ended { background: #565b6b; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .name { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    font-size: 8.5px; font-weight: 700; letter-spacing: 0.5px;
    padding: 1.5px 5px; border-radius: 4px; flex-shrink: 0;
  }
  .badge.claude { background: rgba(217,119,87,0.22); color: #e8927c; }
  .badge.copilot { background: rgba(110,140,255,0.2); color: #94a8ff; }
  .time { margin-left: auto; color: #7c8194; font-size: 10px; flex-shrink: 0; }
  .status-line { margin-top: 3px; font-size: 10px; font-weight: 600; letter-spacing: 0.6px; }
  .status-line.working { color: #4ade80; }
  .status-line.needs-input { color: #fb923c; }
  .status-line.done { color: #60a5fa; }
  .status-line.idle, .status-line.ended { color: #7c8194; }
  .branch { color: #7c8194; font-weight: 400; letter-spacing: 0; }
  .prompt, .reply {
    margin-top: 4px; color: #b7bcc9; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }
  .prompt::before { content: "❯ "; color: #7c8194; }
  .reply { color: #8f95a5; -webkit-line-clamp: 3; }
  .reply::before { content: "✓ "; color: #4ade80; opacity: 0.7; }
  .empty { text-align: center; color: #565b6b; padding: 30px 10px; line-height: 1.6; }
  .empty.quiet { padding: 16px 10px; font-size: 11px; }
  /* repo name, shown when the cmux tab was renamed to something else */
  .ctx { margin-top: 2px; color: #6f7488; font-size: 10px; }
  .ctx::before { content: "▸ "; opacity: 0.7; }
  /* one-of-N tabs in the same pane */
  .tabs { font-size: 9px; color: #7c8194; background: rgba(255,255,255,0.07);
          padding: 1px 4px; border-radius: 4px; flex-shrink: 0; }
  /* live localhost ports owned by this session */
  .ports { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .port {
    font-size: 10px; font-variant-numeric: tabular-nums; font-weight: 600;
    color: #7dd3a8; background: rgba(74,222,128,0.13);
    border: 1px solid rgba(74,222,128,0.28);
    padding: 1px 6px; border-radius: 5px; cursor: pointer;
  }
  .port:hover { background: rgba(74,222,128,0.26); color: #b6f0cf; }
  .port::before { content: "localhost"; opacity: 0.65; font-weight: 400; }
  /* show/hide inactive sessions */
  .toggle {
    display: flex; align-items: center; gap: 6px; width: 100%;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
    color: #8f95a5; font-family: inherit; font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.3px; padding: 5px 10px; border-radius: 8px;
    margin: 2px 0 6px; cursor: pointer;
  }
  .toggle:hover { background: rgba(255,255,255,0.09); color: #d0d4e0; }
  .toggle .chev { font-size: 9px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="title">⚡ chud</span>
    <span class="count" id="count">0</span>
    <span class="spacer"></span>
    <span class="refresh" id="refresh" title="Re-scan all sessions">⟳</span>
    <span class="gear" id="gear" title="Settings">⚙</span>
    <span class="close" id="close">✕</span>
  </header>
  <div id="settings" class="hidden">
    <label><span class="lbl">Opacity · focused</span><input type="range" id="op-f" min="0.2" max="1" step="0.05"><span class="val" id="op-f-v"></span></label>
    <label><span class="lbl">Opacity · unfocused</span><input type="range" id="op-u" min="0.15" max="1" step="0.05"><span class="val" id="op-u-v"></span></label>
    <label><input type="checkbox" id="compact"> Compact view</label>
    <label><input type="checkbox" id="follow"> Follow active monitor</label>
    <label><input type="checkbox" id="done-sound"> Sound when a prompt finishes</label>
    <label><span class="lbl">Sound folder</span><input type="text" id="done-sound-dir" class="pathbox" placeholder="/path/to/sounds"></label>
    <label><span class="lbl">Focus hotkey</span><input type="text" id="hotkey" readonly placeholder="click to record"></label>
    <label><span class="lbl">Hide/show hotkey</span><input type="text" id="toggle-hotkey" readonly placeholder="click to record"></label>
    <div class="hint" id="hotkey-hint">Press hotkey from any app · ↑↓ navigate · Enter jump · Esc back</div>
  </div>
  <div id="list"><div class="empty">Waiting for sessions…</div></div>
</div>
<script src="renderer.js"></script>
</body>
</html>
